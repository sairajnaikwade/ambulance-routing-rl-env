[project]
name = "ambulance-env"
version = "0.1.0"
description = "Ambulance Routing RL Environment using OpenEnv"
authors = [
  { name = "Bhushan Korde" }
]
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic",
  "openai"
]

[project.scripts]
start-server = "server.app:main"

[tool.openenv]
env = "server.env:AmbulanceEnv"
