[project]
name = "ambulance-env"
version = "0.1.0"
description = "Ambulance Routing RL Environment using OpenEnv"
authors = [
  { name = "Bhushan Korde" }
]
dependencies = [
  "openenv-core",
  "fastapi",
  "uvicorn",
  "pydantic"
]

[project.scripts]
server = "server.app:app"

[tool.openenv]
env = "server.env:AmbulanceEnv"
